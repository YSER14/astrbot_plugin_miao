<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1120px;padding:36px;background:#eee9e1;color:#333344;font:22px "Noto Sans CJK SC",sans-serif}h1{font-size:42px;margin:0 0 6px}.sub{color:#777;font-size:20px;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border-radius:20px;background:#fffdf9;padding:24px;break-inside:avoid}h2{margin:0 0 14px;font-size:28px;color:#685b82}.line{line-height:1.8;font-size:20px}.foot{margin-top:24px;text-align:center;color:#888;font-size:17px}
</style></head><body><div id="container"><h1>喵喵米哈游游戏</h1><p class="sub">原神 #　·　星铁 *　·　绝区零 %　｜　“角色”替换为实际名字</p><div class="grid">{{each groups group}}<section class="card"><h2>{{group[0]}}</h2>{{each group[1] line}}<div class="line">{{line}}</div>{{/each}}</section>{{/each}}</div><div class="foot">AstrBot / Miao · Mora · Liangshi · Zolay-Poi</div></div></body></html>
